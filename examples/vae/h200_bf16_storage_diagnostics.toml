# Untimed diagnostic baseline for the original physical batch128/image224/latent4 target.
# --diagnose defaults to batch1 for numerical localization; this does not qualify capacity.
name = "mbconv_vae_v2_native_bf16"
seed = 42

[training]
epochs = 80
batch_size = 128
learning_rate = 0.001
accumulation_steps = 1
optimizer = "custom"
weight_decay = 0.00001
momentum = 0.9
lr_gamma = 1.0
monitor = "loss"
monitor_mode = "min"
checkpoint_every_steps = 200
scheduler_interval = "epoch"

[training.ema]
enabled = false
decay = 0.95

[application.model]
base_channels = 32
max_channels = 512
latent_channels = 4
blocks_per_stage = 2

[application.data]
train_dir = ""
val_dir = ""
image_size = 224
resize_size = 256

[schedules.beta]
type = "linear_warmup"
start = 0.0
end = 0.000001
duration = 10000
interval = "update"

[runtime]
bf16_policy = "bf16_storage"
device = "cuda"
precision = "bf16" # CUDA autocast; model parameters remain FP32.
deterministic = false
execution_mode = "max_speed"
checks = false
fill_uninitialized_memory = false
non_blocking = true

[runtime.fp8]
enabled = false

[runtime.kernels]
backend = "triton"

[runtime.activation_compression]
enabled = true
group_size = 1024
bits = 2
norm_xhat_recenter = true

[runtime.compile]
enabled = true
backend = "deepopt"
fullgraph = true
dynamic = false

[runtime.compile.options]
use_native_autodiff = true
require_full_aot = true
share_compatible_packs = true

[runtime.ddp]
find_unused_parameters = false
broadcast_buffers = true
gradient_as_bucket_view = true
bucket_cap_mb = 25.0
static_graph = false
validation_sync_buffers = true

[loader]
num_workers = 10
pin_memory = true
persistent_workers = true
drop_last = true

[logging]
level = "WARNING"
file_level = "WARNING"

[runtime.activation_memory]
multiply_backward = "packed_streaming"
pack_reuse = "inherit"
reduction_scratch_bytes = 8388608
recompute_modules = []
