name: Correctness and packaging
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 1'
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'torch>=2.4,<3' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check --select E9,F63,F7,F82 src tests
      - run: python -m mypy --strict --follow-imports=skip --ignore-missing-imports src/deepopt/engine/execution/policy.py
      - name: Fast CPU white-box and black-box tests
        run: |
          for group in execution optimization training metrics memory observability application onboarding; do
            python -m unittest discover -s tests/$group -v
          done
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist/*
  multiprocessing:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEEPOPT_EXTENDED_DDP: '1'
      DEEPOPT_TEST_DISTRIBUTED: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'torch>=2.4,<3' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[workers]'
      - name: Worker, checkpoint and real two/four-rank Gloo tests
        run: |
          python -m unittest discover -s tests/data -v
          python -m unittest discover -s tests/checkpointing -v
          python -m unittest discover -s tests/distributed -v
          python -m unittest discover -s tests/metrics -p test_metrics.py -v
  cuda:
    if: vars.DEEPOPT_GPU_CI == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: [self-hosted, linux, x64, gpu]
    timeout-minutes: 60
    env:
      OMP_NUM_THREADS: '1'
      DEEPOPT_LOGGING_LEVEL: ERROR
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install -e '.[workers]'
      - run: python -c 'import torch; assert torch.cuda.device_count() >= 2; assert torch.cuda.is_bf16_supported()'
      - run: python -m unittest discover -s tests/execution -v
      - run: python -m unittest discover -s tests/distributed -v
      - run: torchrun --standalone --nproc-per-node=2 benchmarks/benchmark_execution.py --device cuda --precision bf16 --pinned --non-blocking --profile > benchmark-cuda.json
      - uses: actions/upload-artifact@v4
        with:
          name: cuda-benchmark
          path: benchmark-cuda.json
