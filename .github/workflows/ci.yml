name: Correctness and packaging
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 1'
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install matching CPU PyTorch and torchvision wheels
        run: python -m pip install 'torch>=2.4,<3' 'torchvision>=0.19,<1' --index-url https://download.pytorch.org/whl/cpu
      # Copied benchmark scripts must exercise the installed wheel, not a
      # checkout exposed through an editable-install path hook.
      - run: python -m pip install '.[dev,model-tests]'
      - name: Install Triton for GPU-free kernel API checks
        run: python -m pip install 'triton>=3.3,<4'
      - name: Check deferred Triton language API references
        run: python -m unittest tests.opt.test_triton_language_api -v
      - run: python -m pip check
      - name: Verify torchvision native CPU operators
        run: |
          python - <<'PY'
          import torch
          import torchvision

          print(f"torch={torch.__version__}, torchvision={torchvision.__version__}")
          assert torch.version.cuda is None, "This job requires CPU PyTorch wheels"
          boxes = torch.tensor([[0., 0., 1., 1.], [0., 0., 1., 1.]])
          scores = torch.tensor([0.9, 0.8])
          assert torchvision.ops.nms(boxes, scores, 0.5).tolist() == [0]
          PY
      - run: python -m ruff check src tests examples benchmarks scripts
      - run: python scripts/sync_configs.py --check
      - run: python -m mypy --strict --follow-imports=skip --ignore-missing-imports src/deepopt/engine/execution/policy.py
      - name: Fast CPU white-box and black-box tests
        env:
          DEEPOPT_REQUIRE_MODEL_TESTS: '1'
        run: |
          for group in opt benchmarks cuda execution optimization training metrics memory observability application onboarding scheduling; do
            python -m unittest discover -s tests/$group -v
          done
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist/*
  multiprocessing:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEEPOPT_EXTENDED_DDP: '1'
      DEEPOPT_TEST_DISTRIBUTED: '1'
      OMP_NUM_THREADS: '1'
      PYTHONFAULTHANDLER: '1'
      TORCH_SHOW_CPP_STACKTRACES: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Configure distributed worker log directory
        shell: bash
        run: |
          printf 'DEEPOPT_DDP_LOG_DIR=%s/deepopt-ddp-logs\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install matching CPU PyTorch and torchvision wheels
        run: python -m pip install 'torch>=2.4,<3' 'torchvision>=0.19,<1' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[workers]'
      - run: python -m pip check
      - name: Worker, checkpoint and real two/four-rank Gloo tests
        run: |
          python -m unittest discover -s tests/data -v
          python -m unittest discover -s tests/checkpointing -v
          python -m unittest discover -s tests/distributed -v
          python -m unittest discover -s tests/scheduling -p test_ddp_black_box.py -v
          python -m unittest discover -s tests/metrics -p test_metrics.py -v
      - name: Stress four-rank schedule consistency
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            python -m unittest tests.scheduling.test_ddp_black_box.ScheduleDistributedTests.test_four_rank_consistency_and_collective_count -v
          done
      - name: Preserve distributed worker diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: distributed-worker-logs
          path: ${{ runner.temp }}/deepopt-ddp-logs/
          if-no-files-found: ignore
  cuda:
    if: vars.DEEPOPT_GPU_CI == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: [self-hosted, linux, x64, gpu]
    timeout-minutes: 60
    env:
      OMP_NUM_THREADS: '1'
      DEEPOPT_LOGGING_LEVEL: ERROR
      DEEPOPT_REQUIRE_MODEL_TESTS: '1'
      DEEPOPT_REQUIRE_CUDA_FP8: '1'
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install -e '.[workers,model-tests]'
      - name: Require two FP8-capable GPUs and the Triton descriptor API
        run: |
          python -c 'import torch; from triton.tools.tensor_descriptor import TensorDescriptor; assert torch.cuda.device_count() >= 2; assert all(torch.cuda.get_device_capability(i)[0] >= 9 for i in range(2)); assert torch.cuda.is_bf16_supported(); assert torch.distributed.is_nccl_available()'
      - run: python -m unittest discover -s tests/opt -v
      - run: python -m unittest discover -s tests/execution -v
      - run: python -m unittest discover -s tests/cuda -v
      - run: python -m unittest discover -s tests/distributed -v
      - run: torchrun --standalone --nproc-per-node=2 benchmarks/training/benchmark_execution.py --device cuda --precision bf16 --pinned --non-blocking --profile > benchmark-cuda.json
      - uses: actions/upload-artifact@v4
        with:
          name: cuda-benchmark
          path: benchmark-cuda.json
